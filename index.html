<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Cita - Study Club</title>
  
  <!-- Cargar librería oficial de EmailJS -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .form-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 450px;
    }
    h2 {
      margin-top: 0;
      color: #2c3e50;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Solicitar Reserva</h2>
    
    <!-- FORMULARIO DE RESERVA -->
    <form id="mi-formulario">
      <div class="form-group">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana García" required>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" placeholder="Ej. 612345678" required>
      </div>

      <div class="form-group">
        <label for="tema">Tema a estudiar:</label>
        <input type="text" id="tema" name="tema" placeholder="Ej. Matemáticas, Programación..." required>
      </div>

      <div class="form-group">
        <label for="fecha">Fecha y hora de la cita:</label>
        <input type="datetime-local" id="fecha" name="fecha" required>
      </div>

      <button type="submit" id="btn-enviar">Enviar Reserva</button>
    </form>
  </div>

  <!-- SCRIPT DE ENVÍO DE EMAILJS -->
  <script type="text/javascript">
    (function(){
      // Tu Public Key de EmailJS
      emailjs.init("CqKAPSmFhIGvgXDL7");
    })();

    document.getElementById('mi-formulario').addEventListener('submit', function(event) {
      event.preventDefault();

      const btn = document.getElementById('btn-enviar');
      btn.innerText = 'Enviando...';
      btn.disabled = true;

      // Datos a enviar
      const params = {
        user_name: document.getElementById('nombre').value,
        user_email: document.getElementById('email').value,
        user_phone: document.getElementById('telefono').value,
        user_subject: document.getElementById('tema').value,
        fecha_cita: document.getElementById('fecha').value
      };

      const serviceID = 'service_f4ztkrs';
      const templateAdminID = 'template_8brs2oj';
      const templateUsuarioID = 'template_fea0uvf';

      // 1. Enviar correo al Administrador (infomontcada.meh@gmail.com)
      emailjs.send(serviceID, templateAdminID, params)
        .then(() => {
          // 2. Enviar correo de confirmación al Usuario
          return emailjs.send(serviceID, templateUsuarioID, params);
        })
        .then(() => {
          alert('¡Solicitud enviada con éxito! Revisa tu correo.');
          document.getElementById('mi-formulario').reset();
        })
        .catch((error) => {
          alert('Hubo un problema al enviar la solicitud: ' + JSON.stringify(error));
        })
        .finally(() => {
          btn.innerText = 'Enviar Reserva';
          btn.disabled = false;
        });
    });
  </script>

</body>
</html>
