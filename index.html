<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horario y Reservas - Study Club</title>
  
  <!-- Cargar librería oficial de EmailJS -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .main-container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h2, h3 {
      color: #2c3e50;
      text-align: center;
    }
    
    /* VISTA DE LA SEMANA (TABLA DE SESIONES) */
    .schedule-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 30px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #e0e0e0;
      padding: 12px;
      text-align: center;
      vertical-align: top;
      width: 20%;
    }
    th {
      background-color: #3498db;
      color: white;
    }
    .session-card {
      background-color: #e8f4f8;
      border-left: 4px solid #3498db;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 13px;
      text-align: left;
    }
    .session-title {
      font-weight: bold;
      color: #2c3e50;
      font-size: 14px;
    }
    .session-time {
      color: #7f8c8d;
      font-size: 12px;
      margin: 3px 0;
    }
    .session-participants {
      margin: 6px 0;
      font-size: 12px;
      color: #555;
    }
    .btn-join {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      width: 100%;
      margin-top: 5px;
    }
    .btn-join:hover {
      background-color: #2980b9;
    }

    /* MODAL DEL FORMULARIO DE RESERVA */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .form-container {
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 90%;
      max-width: 450px;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 20px;
      cursor: pointer;
      color: #777;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-submit:hover {
      background-color: #27ae60;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <h2>Horario de Sesiones - Study Club</h2>

    <!-- TABLA DE LA SEMANA CARGADA DESDE GOOGLE SHEETS -->
    <div class="schedule-container">
      <table>
        <thead>
          <tr>
            <th>Lunes</th>
            <th>Martes</th>
            <th>Miércoles</th>
            <th>Jueves</th>
            <th>Viernes</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td id="col-lunes"><em>Cargando...</em></td>
            <td id="col-martes"><em>Cargando...</em></td>
            <td id="col-miercoles"><em>Cargando...</em></td>
            <td id="col-jueves"><em>Cargando...</em></td>
            <td id="col-viernes"><em>Cargando...</em></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- MODAL / VENTANA EMERGENTE CON EL FORMULARIO -->
  <div class="modal-overlay" id="modal-reserva">
    <div class="form-container">
      <span class="close-btn" onclick="cerrarFormulario()">&times;</span>
      <h3>Apuntarse a la Sesión</h3>
      <form id="mi-formulario">
        <div class="form-group">
          <label for="nombre">Nombre completo:</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana García" required>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico:</label>
          <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono:</label>
          <input type="tel" id="telefono" name="telefono" placeholder="Ej. 612345678" required>
        </div>

        <div class="form-group">
          <label for="tema">Tema / Asignatura:</label>
          <input type="text" id="tema" name="tema" required readonly style="background-color: #f0f0f0;">
        </div>

        <div class="form-group">
          <label for="fecha">Día y hora de la sesión:</label>
          <input type="datetime-local" id="fecha" name="fecha" required>
        </div>

        <button type="submit" class="btn-submit" id="btn-enviar">Confirmar Reserva</button>
      </form>
    </div>
  </div>

  <!-- SCRIPT DE MANEJO DE GOOGLE SHEETS Y EMAILJS -->
  <script type="text/javascript">
    (function(){
      emailjs.init("CqKAPSmFhIGvgXDL7");
    })();

    // PEGA AQUÍ TU ENLACE CSV PUBLICADO DESDE GOOGLE SHEETS
    const SHEET_CSV_URL = 'PEGA_AQUI_TU_ENLACE_CSV_PUBLICADO';

    async function cargarHorarioDesdeSheets() {
      if (!SHEET_CSV_URL || SHEET_CSV_URL.includes('PEGA_AQUI')) return;

      try {
        const response = await fetch(SHEET_CSV_URL);
        const data = await response.text();
        const filas = data.split('\n').slice(1); // Omitir cabecera

        const columnas = {
          lunes: document.getElementById('col-lunes'),
          martes: document.getElementById('col-martes'),
          miercoles: document.getElementById('col-miercoles'),
          jueves: document.getElementById('col-jueves'),
          viernes: document.getElementById('col-viernes')
        };

        Object.values(columnas).forEach(col => col.innerHTML = '');

        filas.forEach(fila => {
          const [dia, materia, hora, participantes] = fila.split(',').map(item => item?.trim());
          if (!dia || !materia) return;

          const diaNormalizado = dia.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          
          if (columnas[diaNormalizado]) {
            const card = document.createElement('div');
            card.className = 'session-card';
            card.innerHTML = `
              <div class="session-title">${materia}</div>
              <div class="session-time">${hora || ''}</div>
              <div class="session-participants">👥 N.º de participantes: <strong>${participantes || '0'}</strong></div>
              <button class="btn-join" onclick="abrirFormulario('${materia}')">Apuntarse</button>
            `;
            columnas[diaNormalizado].appendChild(card);
          }
        });
      } catch (error) {
        console.error('Error al cargar la hoja de cálculo:', error);
      }
    }

    function abrirFormulario(asignatura) {
      document.getElementById('tema').value = asignatura;
      document.getElementById('modal-reserva').style.display = 'flex';
    }

    function cerrarFormulario() {
      document.getElementById('modal-reserva').style.display = 'none';
    }

    document.getElementById('mi-formulario').addEventListener('submit', function(event) {
      event.preventDefault();

      const btn = document.getElementById('btn-enviar');
      btn.innerText = 'Enviando...';
      btn.disabled = true;

      const params = {
        user_name: document.getElementById('nombre').value,
        user_email: document.getElementById('email').value,
        user_phone: document.getElementById('telefono').value,
        user_subject: document.getElementById('tema').value,
        fecha_cita: document.getElementById('fecha').value
      };

      const serviceID = 'service_f4ztkrs';
      const templateAdminID = 'template_8brs2oj';
      const templateUsuarioID = 'template_fea0uvf';

      emailjs.send(serviceID, templateAdminID, params)
        .then(() => {
          return emailjs.send(serviceID, templateUsuarioID, params);
        })
        .then(() => {
          alert('¡Solicitud enviada con éxito! Te confirmaremos por correo.');
          document.getElementById('mi-formulario').reset();
          cerrarFormulario();
        })
        .catch((error) => {
          alert('Hubo un problema al enviar la solicitud: ' + JSON.stringify(error));
        })
        .finally(() => {
          btn.innerText = 'Confirmar Reserva';
          btn.disabled = false;
        });
    });

    window.onload = cargarHorarioDesdeSheets;
  </script>

</body>
</html>
