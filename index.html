<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horario y Reservas - Study Club</title>
  
  <!-- Cargar librería oficial de EmailJS -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .main-container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h2, h3 {
      color: #2c3e50;
      text-align: center;
    }
    
    /* VISTA DE LA SEMANA (TABLA DE SESIONES) */
    .schedule-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 30px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #e0e0e0;
      padding: 12px;
      text-align: center;
      vertical-align: top;
      width: 20%;
    }
    th {
      background-color: #3498db;
      color: white;
    }
    .session-card {
      background-color: #e8f4f8;
      border-left: 4px solid #3498db;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 13px;
      text-align: left;
    }
    .session-title {
      font-weight: bold;
      color: #2c3e50;
      font-size: 14px;
    }
    .session-time {
      color: #7f8c8d;
      font-size: 12px;
      margin: 3px 0;
    }
    .session-participants {
      margin: 6px 0;
      font-style: italic;
      color: #555;
    }
    .btn-join {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      width: 100%;
      margin-top: 5px;
    }
    .btn-join:hover {
      background-color: #2980b9;
    }

    /* MODAL DEL FORMULARIO DE RESERVA */
    .modal-overlay {
      display: none; /* Oculto por defecto */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .form-container {
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 90%;
      max-width: 450px;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 20px;
      cursor: pointer;
      color: #777;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-submit:hover {
      background-color: #27ae60;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <h2>Horario de Sesiones - Study Club</h2>

    <!-- TABLA DE LA SEMANA -->
    <div class="schedule-container">
      <table>
        <thead>
          <tr>
            <th>Lunes</th>
            <th>Martes</th>
            <th>Miércoles</th>
            <th>Jueves</th>
            <th>Viernes</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <!-- LUNES -->
            <td>
              <div class="session-card">
                <div class="session-title">Matemáticas</div>
                <div class="session-time">16:00 - 17:30</div>
                <div class="session-participants">👥 Ana G., Carlos M.</div>
                <button class="btn-join" onclick="abrirFormulario('Matemáticas')">Apuntarse</button>
              </div>
            </td>
            <!-- MARTES -->
            <td>
              <div class="session-card">
                <div class="session-title">Programación</div>
                <div class="session-time">17:00 - 18:30</div>
                <div class="session-participants">👥 Marc P.</div>
                <button class="btn-join" onclick="abrirFormulario('Programación')">Apuntarse</button>
              </div>
            </td>
            <!-- MIÉRCOLES -->
            <td>
              <div class="session-card">
                <div class="session-title">Física</div>
                <div class="session-time">16:30 - 18:00</div>
                <div class="session-participants">👥 Laura S., David R.</div>
                <button class="btn-join" onclick="abrirFormulario('Física')">Apuntarse</button>
              </div>
            </td>
            <!-- JUEVES -->
            <td>
              <div class="session-card">
                <div class="session-title">Inglés</div>
                <div class="session-time">18:00 - 19:30</div>
                <div class="session-participants">👥 Sin inscritos</div>
                <button class="btn-join" onclick="abrirFormulario('Inglés')">Apuntarse</button>
              </div>
            </td>
            <!-- VIERNES -->
            <td>
              <div class="session-card">
                <div class="session-title">Química</div>
                <div class="session-time">16:00 - 17:30</div>
                <div class="session-participants">👥 Elena T.</div>
                <button class="btn-join" onclick="abrirFormulario('Química')">Apuntarse</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- MODAL / VENTANA EMERGENTE CON EL FORMULARIO -->
  <div class="modal-overlay" id="modal-reserva">
    <div class="form-container">
      <span class="close-btn" onclick="cerrarFormulario()">&times;</span>
      <h3>Apuntarse a la Sesión</h3>
      <form id="mi-formulario">
        <div class="form-group">
          <label for="nombre">Nombre completo:</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana García" required>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico:</label>
          <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono:</label>
          <input type="tel" id="telefono" name="telefono" placeholder="Ej. 612345678" required>
        </div>

        <div class="form-group">
          <label for="tema">Tema / Asignatura:</label>
          <input type="text" id="tema" name="tema" required readonly style="background-color: #f0f0f0;">
        </div>

        <div class="form-group">
          <label for="fecha">Día y hora de la sesión:</label>
          <input type="datetime-local" id="fecha" name="fecha" required>
        </div>

        <button type="submit" class="btn-submit" id="btn-enviar">Confirmar Reserva</button>
      </form>
    </div>
  </div>

  <!-- SCRIPT DE MANEJO DE MODAL Y EMAILJS -->
  <script type="text/javascript">
    (function(){
      emailjs.init("CqKAPSmFhIGvgXDL7");
    })();

    // Abrir ventana flotante con la asignatura ya rellenada
    function abrirFormulario(asignatura) {
      document.getElementById('tema').value = asignatura;
      document.getElementById('modal-reserva').style.display = 'flex';
    }

    // Cerrar ventana flotante
    function cerrarFormulario() {
      document.getElementById('modal-reserva').style.display = 'none';
    }

    // Enviar solicitud con EmailJS
    document.getElementById('mi-formulario').addEventListener('submit', function(event) {
      event.preventDefault();

      const btn = document.getElementById('btn-enviar');
      btn.innerText = 'Enviando...';
      btn.disabled = true;

      const params = {
        user_name: document.getElementById('nombre').value,
        user_email: document.getElementById('email').value,
        user_phone: document.getElementById('telefono').value,
        user_subject: document.getElementById('tema').value,
        fecha_cita: document.getElementById('fecha').value
      };

      const serviceID = 'service_f4ztkrs';
      const templateAdminID = 'template_8brs2oj';
      const templateUsuarioID = 'template_fea0uvf';

      emailjs.send(serviceID, templateAdminID, params)
        .then(() => {
          return emailjs.send(serviceID, templateUsuarioID, params);
        })
        .then(() => {
          alert('¡Solicitud enviada con éxito! Te confirmaremos por correo.');
          document.getElementById('mi-formulario').reset();
          cerrarFormulario();
        })
        .catch((error) => {
          alert('Hubo un problema al enviar la solicitud: ' + JSON.stringify(error));
        })
        .finally(() => {
          btn.innerText = 'Confirmar Reserva';
          btn.disabled = false;
        });
    });
  </script>

</body>
</html>
