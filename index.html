<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyClub - Reserva tu cita</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-container">
            <div>
                <div class="logo">StudyClub</div>
                <div class="subtitle">Reserva tu sesión de estudio</div>
            </div>
            <button id="adminToggleBtn" class="admin-btn">Panel Admin</button>
        </div>
    </header>

    <main>
        <section class="welcome">
            <h1>Horario semanal</h1>
            <p>Elige una cita y únete a una sesión de estudio (Máximo 6 integrantes por grupo).</p>
        </section>

        <section class="week-navigation">
            <button id="previousWeek">‹ Semana anterior</button>
            <h2 id="weekTitle">Cargando semana...</h2>
            <button id="nextWeek">Semana siguiente ›</button>
        </section>

        <!-- Contenedor dinámico de días -->
        <section class="schedule" id="scheduleContainer">
            <div class="loading">Cargando disponibilidad de la semana...</div>
        </section>

        <!-- Modal de Reserva para el Cliente -->
        <div id="bookingModal" class="modal hidden">
            <div class="modal-content">
                <button class="close-button" id="closeModal">&times;</button>
                <h2>Únete a la cita</h2>
                <p id="selectedAppointmentDetails" class="appointment-details-badge"></p>

                <form id="bookingForm">
                    <input type="hidden" id="selectedDate">
                    <input type="hidden" id="selectedTime" value="20:10 - 20:40">

                    <label for="studentName">Nombre del alumno *</label>
                    <input type="text" id="studentName" required placeholder="Ej: Juan Pérez">

                    <label for="email">Correo electrónico *</label>
                    <input type="email" id="email" required placeholder="tuemail@ejemplo.com">

                    <label for="phone">Número de teléfono *</label>
                    <input type="tel" id="phone" required placeholder="600000000">

                    <label for="topic">Tema de estudio *</label>
                    <input type="text" id="topic" placeholder="Ej. Present Simple" required>

                    <button type="submit" id="submitBooking" class="confirm-button">
                        Confirmar reserva
                    </button>
                </form>
            </div>
        </div>

        <!-- Modal del Admin para Renombrar Cita -->
        <div id="adminModal" class="modal hidden">
            <div class="modal-content">
                <button class="close-button" id="closeAdminModal">&times;</button>
                <h2>Editar Nombre de Cita</h2>
                <form id="adminForm">
                    <input type="hidden" id="adminSelectedDate">
                    <p id="adminAppointmentLabel"></p>
                    
                    <label for="customTitle">Nombre personalizado de la sesión:</label>
                    <input type="text" id="customTitle" placeholder="Ej. Grupo Gramática Avanzada" required>

                    <button type="submit" class="confirm-button">Guardar Nombre</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>StudyClub · Sesiones de apoyo y estudio</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
